<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIT - II Question Bank Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Controls -->
        <header>
            <h1>Scientific & Technological Sustainability Quiz</h1>
            <button id="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
        </header>

        <!-- Quiz Mode Selection Screen -->
        <div id="start-screen" class="card">
            <h2>Select Quiz Mode</h2>
            <p>Choose the number of questions to attempt (options and questions are randomized):</p>
            <div class="mode-buttons">
                <button class="btn" onclick="startQuiz(40)">40 Random Questions</button>
                <button class="btn" onclick="startQuiz(100)">All 100 Questions</button>
            </div>
        </div>

        <!-- Quiz Interface Screen -->
        <div id="quiz-screen" class="card hidden">
            <div class="quiz-header">
                <span id="question-tracker">Question 1 of 100</span>
                <span id="score-tracker">Score: 0</span>
            </div>
            
            <h3 id="question-text">Question goes here...</h3>
            
            <div id="options-container" class="options-grid"></div>

            <div id="feedback" class="feedback-msg hidden"></div>

            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Next Question</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="card hidden">
            <h2>Quiz Completed! 🎉</h2>
            <p id="final-score">Your Score: 0 / 0</p>
            <p id="percentage">Percentage: 0%</p>
            <button class="btn" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
